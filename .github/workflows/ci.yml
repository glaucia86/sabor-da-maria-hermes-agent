name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application-checks:
    name: Application checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install uv
        run: python -m pip install uv==0.9.5

      - name: Install locked dependencies
        run: uv sync --locked --python 3.13

      - name: Run application tests
        run: uv run --locked --no-sync python -X utf8 -B -m pytest tests/unit tests/integration -q

      - name: Lint
        run: uv run --locked --no-sync ruff check src tests/unit tests/integration evals

      - name: Check formatting
        run: uv run --locked --no-sync ruff format --check src tests/unit tests/integration evals
