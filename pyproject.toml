[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sabor-da-maria"
version = "0.0.1"
description = "Servidor MCP local da Sabor da Maria — despensa e candidatas pesquisadas"
requires-python = ">=3.13"
dependencies = [
    "mcp==2.3.0",
    "openpyxl>=3.1.5",
    "pydantic==2.14.3",
]

[dependency-groups]
dev = [
    "hypothesis>=6,<7",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dona_maria.hermes_policy" = ["plugin.yaml"]
"dona_maria.hermes_research" = ["plugin.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
